{% extends "base.html" %}
{% block content %}
<h2>{% if item %}Edit Item{% else %}Add Item{% endif %}</h2>
<form method="post">
  {% csrf_token %}
  <label for="name">Name:</label>
  <input type="text" name="name" value="{{ item.name|default:'' }}" required><br>

  <label for="quantity">Quantity:</label>
  <input type="number" name="quantity" value="{{ item.quantity|default:'' }}" required><br>

  <label for="price">Price:</label>
  <input type="number" step="0.01" name="price" value="{{ item.price|default:'' }}" required><br>

  <button type="submit">Save</button>
</form>
{% endblock %}
