{% extends "base.html" %}

{% block content %}
<div class="row">
  <div class="col-12 col-md-6">
    <div class="card">
      <div class="card-body">
        <h4 class="card-title">{% if item %}Edit Item{% else %}Add New Item{% endif %}</h4>
        <form method="POST">
          {% csrf_token %}
          {% for field in form %}
          <div class="form-group mb-3">
            <label>{{ field.label }}</label>
            {{ field }}
            {% if field.errors %}
            <div class="text-danger">{{ field.errors }}</div>
            {% endif %}
          </div>
          {% endfor %}
          <button type="submit" class="btn btn-primary">Save</button>
          <a href="{% url 'item_list' %}" class="btn btn-secondary">Cancel</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
